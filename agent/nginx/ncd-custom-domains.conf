# nextjs-vps-custom-domains: shared nginx config, installed by agent/install.sh
# into whichever directory nginx includes in its http{} block (conf.d or sites-enabled).
#
# Deliberately contains NO catch-all / default_server and NO regex server_name:
# the host may also serve other sites, and an unmatched Host header must keep
# reaching whatever server is already the default. Every custom domain gets an
# explicit server_name in its own file under /etc/nginx/ncd-custom-domains/.

# Per-client limits for custom domains (traffic reaches this host directly).
limit_req_zone  $binary_remote_addr zone=ncd_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=ncd_conn:10m;

include /etc/nginx/ncd-custom-domains/*.conf;
