name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problems: do not file here, see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Where is it deployed? (VPS provider, EC2, Azure VM, Kubernetes...)
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs (app stdout, journalctl -u ncd-agent). Remove secrets and hostnames you do not want public.
      render: text
